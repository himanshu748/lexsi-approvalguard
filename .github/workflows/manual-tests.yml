name: CPU-only manual tests

on:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests (no dependencies or external services)
        run: PYTHONPATH=src python -m unittest discover -s tests -v
